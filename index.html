window.firestoreStore={db,collection,doc,getDocs,setDoc,updateDoc,deleteDoc,serverTimestamp,Timestamp};
window.scheduleAssistant=createScheduleAssistant({model:aiModel,getContext:()=>window.dailyPlannerContext?.()||{}});
window.addEventListener('error',e=>{const n=document.getElementById('authStatus');if(n)n.textContent='登入程式錯誤：'+(e.message||'未知錯誤')});window.addEventListener('unhandledrejection',e=>{const n=document.getElementById('authStatus');if(n)n.textContent='登入請求失敗：'+(e.reason?.message||e.reason||'未知錯誤')});
const status=document.getElementById('authStatus'),signIn=document.getElementById('googleSignIn'),signOutButton=document.getElementById('googleSignOut'),userBox=document.getElementById('authUser'),userName=document.getElementById('authName'),userPhoto=document.getElementById('authPhoto'),avatar=document.getElementById('avatar'),authHelp=document.getElementById('authHelp');
document.getElementById('signInRedirect').addEventListener('click',async()=>{signIn.disabled=true;status.textContent='正在前往 Google 安全登入…';try{await signInWithRedirect(auth,provider)}catch(e){status.textContent='Google 登入失敗：'+(e.message||e.code);signIn.disabled=false}});document.getElementById('authRetry').addEventListener('click',async()=>{status.textContent='正在檢查登入狀態…';try{await getRedirectResult(auth)}catch(e){status.textContent='登入未完成：'+(e.message||e.code)}});
signIn.addEventListener('click',async()=>{signIn.disabled=true;status.textContent='正在開啟 Google 安全登入…';try{await signInWithPopup(auth,provider)}catch(e){status.textContent=e.code==='auth/unauthorized-domain'?'此網站網域尚未加入 Firebase 授權網域，請在 Firebase Authentication 設定新增。':e.code==='auth/popup-closed-by-user'?'登入視窗已關閉，尚未登入。':'Google 登入失敗：'+(e.message||e.code)}finally{signIn.disabled=false}});

onAuthStateChanged(auth,user=>{if(user){status.textContent='Google 帳號已登入';userName.textContent=user.displayName||user.email||'Google 使用者';userPhoto.src=user.photoURL||'';avatar.textContent=(user.displayName||user.email||'我').slice(0,1);userBox.style.display='flex';signIn.style.display='none';if(authHelp)authHelp.hidden=true}else{status.textContent='登入後可識別帳號；目前資料仍保存在本機。';avatar.textContent='我';userBox.style.display='none';signIn.style.display='inline-block';if(authHelp)authHelp.hidden=false}window.firebaseAuthUser=user;window.dispatchEvent(new CustomEvent('firebase-auth-state',{detail:user}))});

<script>
(()=>{const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0'), dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}, today=new Date();today.setHours(0,0,0,0);let selected=new Date(today),calendarMonth=new Date(today.getFullYear(),today.getMonth(),1),type='task';const storeKey='daily-planner-v1',userStoreKey=uid=>`${storeKey}:user:${uid}`,migrationKey=uid=>`${storeKey}:migrated:${uid}`;
const readLocal=key=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}};
let items=readLocal(storeKey),currentUser=null,cloudReady=false,authRun=0,writeQueue=Promise.resolve();

const themeSelect=$('#themeSelect'),themeKey='daily-planner-theme-v1',allowedThemes=new Set(['soft','minimal','gaming']);
function setTheme(value,persist=true){const theme=allowedThemes.has(value)?value:'soft';document.body.dataset.theme=theme;if(themeSelect)themeSelect.value=theme;const meta=document.querySelector('meta[name=theme-color]');if(meta)meta.content=theme==='gaming'?'#06111f':theme==='minimal'?'#f4f6f8':'#f7f7f4';if(persist){try{localStorage.setItem(themeKey,theme)}catch{}}}
let savedTheme='soft';try{savedTheme=localStorage.getItem(themeKey)||'soft'}catch{}setTheme(savedTheme,false);themeSelect?.addEventListener('change',()=>setTheme(themeSelect.value));

 window.dailyPlannerContext=()=>({user:currentUser,ready:cloudReady,items,todayKey:dateKey(today),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Taipei'});
const remoteIdsByUser=new Map(),itemKey=item=>`${item.type}:${item.id}`;
const getRemoteIds=uid=>{if(!remoteIdsByUser.has(uid))remoteIdsByUser.set(uid,new Set());return remoteIdsByUser.get(uid)};
const authStatus=document.getElementById('authStatus');
const save=()=>{const uid=currentUser?.uid||null;localStorage.setItem(uid?userStoreKey(uid):storeKey,JSON.stringify(items));if(!uid||!cloudReady)return;const snapshot=items.map(item=>({...item}));writeQueue=writeQueue.then(()=>persistSnapshot(snapshot,uid)).catch(error=>{if(currentUser?.uid===uid)authStatus.textContent='Firestore 儲存失敗：'+(error.message||error.code||'請稍後重試')})};
function firestoreItemRef(uid,item){const fs=window.firestoreStore,name=item.type==='event'?'events':'tasks';return fs.doc(fs.collection(fs.db,'users',uid,name),item.id)}
function serializeItem(item,uid){const fs=window.firestoreStore,updatedAt=fs.serverTimestamp();if(item.type==='event'){const start=new Date(item.startAtISO||`${item.date}T${item.time||'00:00'}:00`),allDay=item.allDay??!item.time,end=item.endAtISO?new Date(item.endAtISO):item.endTime?new Date(`${item.date}T${item.endTime}:00`):new Date(start.getTime()+(allDay?86400000:3600000));return{title:item.title,ownerId:uid,startAt:fs.Timestamp.fromDate(start),endAt:fs.Timestamp.fromDate(end),allDay,category:item.category||'personal',description:item.description||'',location:item.location||'',updatedAt}}const dueAt=new Date(item.dueAtISO||`${item.date}T00:00:00`);return{title:item.title,ownerId:uid,dueAt:fs.Timestamp.fromDate(dueAt),done:!!item.done,updatedAt}}
async function persistSnapshot(snapshot,uid){if(currentUser?.uid!==uid)return;const fs=window.firestoreStore,remoteIds=getRemoteIds(uid),wanted=new Set(snapshot.map(itemKey));for(const key of Array.from(remoteIds)){if(wanted.has(key))continue;const split=key.indexOf(':'),type=key.slice(0,split),id=key.slice(split+1),fake={type,id};await fs.deleteDoc(firestoreItemRef(uid,fake));remoteIds.delete(key)}for(const item of snapshot){const key=itemKey(item),ref=firestoreItemRef(uid,item),payload=serializeItem(item,uid);if(remoteIds.has(key))await fs.updateDoc(ref,payload);else await fs.setDoc(ref,{...payload,createdAt:fs.serverTimestamp()});remoteIds.add(key)}}
function timestampDate(value){return value?.toDate?value.toDate():value instanceof Date?value:null}
function eventFromDoc(id,data){const start=timestampDate(data.startAt);if(!start||!data.title)return null;const end=timestampDate(data.endAt);return{id,title:data.title,type:'event',date:dateKey(start),time:data.allDay?'':`${pad(start.getHours())}:${pad(start.getMinutes())}`,endTime:data.allDay||!end?'':`${pad(end.getHours())}:${pad(end.getMinutes())}`,allDay:!!data.allDay,startAtISO:start.toISOString(),endAtISO:end?.toISOString(),category:data.category||'personal',description:data.description||'',location:data.location||'',done:false}}
function taskFromDoc(id,data){const due=timestampDate(data.dueAt);if(!due||!data.title)return null;return{id,title:data.title,type:'task',date:dateKey(due),dueAtISO:due.toISOString(),done:!!data.done}}
async function handleAuthState(user){const oldUid=currentUser?.uid||null,newUid=user?.uid||null;if(oldUid===newUid)return;const run=++authRun;currentUser=user||null;cloudReady=false;window.scheduleAssistant?.setUser(user||null);window.scheduleAssistant?.refresh();if(!user){items=readLocal(storeKey);getRemoteIds(oldUid||'').clear();render();return}items=readLocal(userStoreKey(user.uid));render();authStatus.textContent='正在從 Firestore 載入資料…';try{const fs=window.firestoreStore,[events,tasks]=await Promise.all([fs.getDocs(fs.collection(fs.db,'users',user.uid,'events')),fs.getDocs(fs.collection(fs.db,'users',user.uid,'tasks'))]);if(run!==authRun||currentUser?.uid!==user.uid)return;const remoteItems=[],remoteIds=getRemoteIds(user.uid);remoteIds.clear();events.forEach(snap=>{const item=eventFromDoc(snap.id,snap.data());if(item){remoteItems.push(item);remoteIds.add(itemKey(item))}});tasks.forEach(snap=>{const item=taskFromDoc(snap.id,snap.data());if(item){remoteItems.push(item);remoteIds.add(itemKey(item))}});const localItems=readLocal(userStoreKey(user.uid)),guestItems=localStorage.getItem(migrationKey(user.uid))==='1'?[]:readLocal(storeKey),merged=[...remoteItems],present=new Set(merged.map(itemKey));for(const item of [...localItems,...guestItems])if(!present.has(itemKey(item))){merged.push(item);present.add(itemKey(item))}items=merged;cloudReady=true;localStorage.setItem(userStoreKey(user.uid),JSON.stringify(items));render();window.scheduleAssistant?.refresh();await persistSnapshot(items.map(item=>({...item})),user.uid);if(run===authRun){localStorage.setItem(migrationKey(user.uid),'1');authStatus.textContent='資料已同步至 Firestore'}}catch(error){if(run===authRun){cloudReady=false;window.scheduleAssistant?.refresh();authStatus.textContent='Firestore 載入失敗：'+(error.message||error.code||'請確認資料庫與安全規則')}}}
window.addEventListener('firebase-auth-state',event=>handleAuthState(event.detail));
const fmtDate=(d,opts={month:'long',day:'numeric',weekday:'short'})=>new Intl.DateTimeFormat('zh-TW',opts).format(d);function updateHeaderClock(){const now=new Date(),time=new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);$('#headerDate').textContent=fmtDate(now,{year:'numeric',month:'long',day:'numeric',weekday:'short'})+' · '+time}const relative=d=>{const n=Math.round((d-today)/86400000);return n===0?'今天':n===1?'明天':n<0?`${Math.abs(n)} 天前`:`${n} 天後`};
function render(){const key=dateKey(selected),isToday=key===dateKey(today);$('#dateTitle').textContent=isToday?'今天 · '+fmtDate(selected):fmtDate(selected,{year:'numeric',month:'long',day:'numeric',weekday:'short'});updateHeaderClock();$('#greeting').textContent=isToday?'早安，今天也加油':'安排好每一天';$('#itemDate').value=key;const events=items.filter(x=>x.type==='event'&&x.date===key).sort((a,b)=>(a.time||'').localeCompare(b.time||''));const tasks=items.filter(x=>x.type==='task'&&x.date===key);$('#eventCount').textContent=events.length?`${events.length} 項`:'';$('#taskCount').textContent=tasks.length?`${tasks.filter(x=>!x.done).length} 項未完成`:'';drawList('#eventList',events,'event');drawList('#taskList',tasks,'task');drawCalendar();drawDue()}
function drawList(sel,list,t){const el=$(sel);if(!list.length){el.innerHTML=`<div class="empty">${t==='event'?'今天還沒有行程，留點空白也很好。':'今天沒有待辦，享受清爽的一天。'}</div>`;return}el.innerHTML=list.map(x=>`<div class="item ${x.done?'done-row':''}">${t==='task'?`<button class="check ${x.done?'done':''}" data-done="${x.id}" aria-label="${x.done?'標記未完成':'完成任務'}">${x.done?'✓':''}</button>`:`<span class="time-pill">${x.allDay?'全天':([x.time,x.endTime].filter(Boolean).join('–')||'未設定時間')}</span>`}<div class="item-copy"><div class="item-title">${esc(x.title)}</div>${t==='task'&&x.done?'<div class="item-meta">已完成</div>':''}</div>${t==='task'&&!x.done?`<span class="${x.date<dateKey(today)?'due-pill overdue':'due-pill'}">${x.date<dateKey(today)?'已逾期':isDueSoon(x.date)?'即將到期':''}</span>`:''}<button class="item-delete" data-del="${x.id}" aria-label="刪除">×</button></div>`).join('')||'<div class="empty">沒有未完成的任務。</div>'}
function isDueSoon(k){const n=(parseDate(k)-today)/86400000;return n>=0&&n<=3}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawCalendar(){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth();$('#monthName').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long'}).format(calendarMonth);const names=['日','一','二','三','四','五','六'];let html=names.map(n=>`<span class="weekday">${n}</span>`).join('');const start=new Date(y,m,1),offset=start.getDay(),days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();for(let i=0;i<42;i++){let d,other=false;if(i<offset){d=new Date(y,m-1,prevDays-offset+i+1);other=true}else if(i>=offset+days){d=new Date(y,m+1,i-offset-days+1);other=true}else d=new Date(y,m,i-offset+1);const k=dateKey(d),cls=['day',other?'other':'',k===dateKey(selected)?'selected':'',k===dateKey(today)?'today':'',items.some(x=>x.date===k)?'has-items':''].filter(Boolean).join(' ');html+=`<button class="${cls}" data-date="${k}" aria-label="${k}">${d.getDate()}</button>`}$('#calendar').innerHTML=html}
function drawDue(){const upcoming=items.filter(x=>x.type==='task'&&!x.done&&x.date>=dateKey(today)&&x.date<=dateKey(new Date(today.getFullYear(),today.getMonth(),today.getDate()+3))).sort((a,b)=>a.date.localeCompare(b.date));$('#dueCount').textContent=upcoming.length?`${upcoming.length} 項`:'';$('#dueList').innerHTML=upcoming.length?upcoming.slice(0,5).map(x=>`<div class="due-entry"><span class="due-entry-title">${esc(x.title)}</span><span class="due-entry-date">${relative(parseDate(x.date))}</span></div>`).join(''):'<div class="due-empty">近期沒有到期任務 ✨</div>'}
$('.add-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-type]');if(!b)return;type=b.dataset.type;$('.tab.active').classList.remove('active');b.classList.add('active');$('#itemName').placeholder=type==='task'?'新增一項任務…':'新增一個行程…';const eventMode=type==='event';$('#startTimeGroup').style.display=eventMode?'flex':'none';$('#endTimeGroup').style.display=eventMode?'flex':'none';$('#itemTime').required=eventMode;$('#itemEndTime').required=eventMode;$('#itemEndTime').min=$('#itemTime').value||'';$('#itemDate').value=dateKey(selected)});function validateEventTime(){const start=$('#itemTime').value,end=$('#itemEndTime').value;$('#itemEndTime').min=start||'';$('#itemEndTime').setCustomValidity(start&&end&&end<=start?'結束時間必須晚於開始時間。':'')}$('#itemTime').addEventListener('change',validateEventTime);$('#itemEndTime').addEventListener('input',validateEventTime);$('#addForm').addEventListener('submit',e=>{e.preventDefault();const title=$('#itemName').value.trim();if(!title)return;if(type==='event'){validateEventTime();if(!$('#itemEndTime').reportValidity())return}items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,type,date:$('#itemDate').value||dateKey(selected),time:type==='event'?$('#itemTime').value:'',endTime:type==='event'?$('#itemEndTime').value:'',done:false});save();$('#itemName').value='';$('#itemTime').value='';$('#itemEndTime').value='';$('#itemEndTime').setCustomValidity('');render();$('#itemName').focus()});document.addEventListener('click',e=>{const done=e.target.closest('[data-done]'),del=e.target.closest('[data-del]'),day=e.target.closest('[data-date]');if(done){const x=items.find(i=>i.id===done.dataset.done);if(x)x.done=!x.done;save();render()}if(del){items=items.filter(i=>i.id!==del.dataset.del);save();render()}if(day){selected=parseDate(day.dataset.date);calendarMonth=new Date(selected.getFullYear(),selected.getMonth(),1);render()}});$('#prevDay').onclick=()=>{selected.setDate(selected.getDate()-1);calendarMonth=new Date(selected.getFullYear(),selected.getMonth(),1);render()};$('#nextDay').onclick=()=>{selected.setDate(selected.getDate()+1);calendarMonth=new Date(selected.getFullYear(),selected.getMonth(),1);render()};$('#goToday').onclick=()=>{selected=new Date(today);calendarMonth=new Date(today.getFullYear(),today.getMonth(),1);render()};$('#prevMonth').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()-1);drawCalendar()};$('#nextMonth').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()+1);drawCalendar()};window.setInterval(updateHeaderClock,1000);render()})();
</script></body></html>
