<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><span class="brand-mark">日</span> 日常</div>
 <div class="workspace"><div class="avatar">我</div><div><small>個人空間</small><b>我的行程</b></div><span style="margin-left:auto;color:#97a098">⌄</span></div>
 <div class="nav-label">工作區</div><nav class="nav"><button class="active" data-view="today"><span class="icon">◷</span>今日總覽<span class="count" id="navTodayCount">0</span></button><button data-view="week"><span class="icon">▦</span>週曆</button><button data-view="tasks"><span class="icon">✓</span>所有任務<span class="count" id="navTaskCount">0</span></button><button data-view="events"><span class="icon">◇</span>所有行程</button></nav>
 <div class="side-section"><div class="nav-label">今天</div><div class="side-date"><b id="sideDate"></b><br>把重要的事，一件一件完成。</div></div><div class="side-bottom">簡單安排每一天<br>你的個人行程空間</div>
</aside>
<main class="main">
 <div class="topline"><div class="crumb">日常 / <b id="crumbCurrent">今日總覽</b></div><div class="top-actions"><button class="icon-btn" id="todayBtn" title="回到今天">⌂</button><button class="icon-btn" id="helpBtn" title="使用提示">說明</button></div></div>
 <header class="pagehead"><div><div class="eyebrow" id="eyebrow"></div><h1 id="pageTitle">今天的安排</h1><p id="pageSubtitle">把行程與待辦放在一起，讓每一天更從容。</p></div></header>
 <section class="metrics"><div class="metric"><div class="metric-top"><span>今日行程</span><span class="metric-icon">◷</span></div><div class="metric-num" id="eventMetric">0 <span>項安排</span></div><div class="progress"><i id="eventProgress" style="width:0%"></i></div></div><div class="metric"><div class="metric-top"><span>待完成任務</span><span class="metric-icon">✓</span></div><div class="metric-num" id="taskMetric">0 <span>項待辦</span></div><div class="progress"><i id="taskProgress" style="width:0%"></i></div></div><div class="metric"><div class="metric-top"><span>任務完成率</span><span class="metric-icon">↗</span></div><div class="metric-num" id="progressMetric">0<span>%</span></div><div class="progress"><i id="completionProgress" style="width:0%"></i></div></div></section>
 <div class="content-grid"><section class="panel schedule"><div class="schedule-head"><div><h2 id="scheduleTitle">今日清單</h2><small id="scheduleSub">行程與任務</small></div><select class="filter" id="filterSelect" aria-label="篩選項目"><option value="all">全部</option><option value="event">行程</option><option value="task">任務</option></select></div>
 <div class="quick-add"><form id="quickTaskForm"><span class="quick-mark task-mark">✓</span><input id="quickTaskName" aria-label="快速新增任務標題" placeholder="新增一項任務…" maxlength="80" autocomplete="off"><button type="submit" aria-label="新增任務">＋</button></form>
 <form id="quickEventForm"><span class="quick-mark event-mark">◷</span><input id="quickEventName" aria-label="快速新增行程標題" placeholder="新增一個行程…" maxlength="80" autocomplete="off"><input id="quickEventTime" type="time" value="09:00" aria-label="行程開始時間"><button type="submit" aria-label="新增行程">＋</button></form></div><div class="timeline" id="timeline"></div></section>
 <section class="panel calendar-wrap"><div class="section-head"><div><div class="section-title">每週行事曆</div><div class="section-sub">選擇日期查看安排</div></div><div class="month-controls"><button id="prevWeek" aria-label="上一週">‹</button><span id="weekLabel"></span><button id="nextWeek" aria-label="下一週">›</button></div></div><div class="week" id="weekGrid"></div></section></div>
</main>
<aside class="rightbar"><div class="right-title">今日概況</div><div class="focus-card"><div class="focus-label">任務進度</div><h3>一步一步完成今天</h3><p id="focusCount">目前沒有待辦任務</p><div class="focus-progress"><i id="focusProgress" style="width:0%"></i></div><div class="focus-foot"><span>今日完成率</span><span id="focusPercent">0%</span></div></div>
 <div class="mini-head"><b>今日待辦</b><button data-view="tasks">查看全部</button></div><div class="tasks-list" id="priorityTasks"></div><div class="completed"><div class="mini-head"><b>已完成</b><span id="doneCount" style="font-size:10px;color:#89938c">0 項</span></div><div id="doneTasks"></div></div><div class="tip"><b>小提醒</b><br>任務以日期管理；行程可設定開始時間。資料保存在目前瀏覽器。</div></aside></div>
<nav class="mobile-nav"><button class="active" data-view="today"><span>⌂</span>今天</button><button data-view="week"><span>▦</span>週曆</button><button id="mobileAdd"><span style="font-size:21px;color:#315f4e">＋</span>新增</button><button data-view="tasks"><span>✓</span>任務</button><button data-view="events"><span>◷</span>行程</button></nav>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-top"><div><h2>新增項目</h2><p>填入標題與日期即可快速建立</p></div><button class="close" id="closeModal" aria-label="關閉">×</button></div><form id="itemForm"><div class="type-switch"><button type="button" class="active" data-type="task">任務</button><button type="button" data-type="event">行程</button></div><input type="hidden" id="itemType" value="task"><div class="field"><label for="itemName">標題</label><input id="itemName" required maxlength="80" placeholder="輸入任務或行程名稱"></div><div class="fields"><div class="field"><label for="itemDate">日期</label><input id="itemDate" type="date" required></div><div class="field" id="priorityField" style="display:none"></div></div>
<div class="field" id="startField"><label for="startTime" id="startLabel">開始時間（選填）</label><input id="startTime" type="time" value="09:00"></div><div class="form-actions"><button type="button" class="secondary" id="cancelModal">取消</button><button class="primary" type="submit">新增項目</button></div></form></div></div><div class="toast" id="toast"></div>
