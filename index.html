$('#taskForm').onsubmit=e=>{e.preventDefault();const t=$('#taskTitle');if(t.value.trim())add('task',t.value,key(selected));t.value='';t.focus()};$('#eventForm').onsubmit=e=>{e.preventDefault();const t=$('#eventTitle');if(t.value.trim())add('event',t.value,key(selected),$('#eventTime').value);t.value='';t.focus()};$('#prev').onclick=()=>{selected.setDate(selected.getDate()-1);render()};$('#next').onclick=()=>{selected.setDate(selected.getDate()+1);render()};$('#goToday').onclick=()=>{selected=new Date(today);month=new Date(today.getFullYear(),today.getMonth(),1);render()};$('#prevMonth').onclick=()=>{month.setMonth(month.getMonth()-1);renderCalendar()};$('#nextMonth').onclick=()=>{month.setMonth(month.getMonth()+1);renderCalendar()};$('#focusTasks').onclick=()=>$('#tasksPanel').scrollIntoView({behavior:'smooth'});$('#focusEvents').onclick=()=>$('#eventsPanel').scrollIntoView({behavior:'smooth'});$('#mobileToday').onclick=()=>{$('#taskTitle').focus();window.scrollTo({top:0,behavior:'smooth'})};
$('#signIn').onclick=async()=>{try{$('#signIn').disabled=true;$('#authStatus').textContent='正在開啟 Google 登入…';await signInWithPopup(auth,provider)}catch(e){$('#authStatus').textContent=e.code==='auth/unauthorized-domain'?'登入網域尚未加入 Firebase 授權網域：zongzong1208.github.io':e.code==='auth/popup-blocked'?'彈出視窗遭封鎖，請使用下方「登入視窗無法開啟？」':e.message||e.code}finally{$('#signIn').disabled=false}};$('#redirect').onclick=async()=>{try{await signInWithRedirect(auth,provider)}catch(e){$('#authStatus').textContent='Google 登入失敗：'+(e.message||e.code)}};$('#signOut').onclick=()=>signOut(auth);getRedirectResult(auth).catch(e=>{$('#authStatus').textContent='Google 登入結果：'+(e.message||e.code)});onAuthStateChanged(auth,u=>{stopCloud();if(!u){user=null;scheduleAssistant.setUser(null);items=readLocal(guestKey);$('#authUser').style.display='none';$('#signIn').style.display='block';$('#redirect').style.display='block';$('#authStatus').textContent='登入 Google 後，資料會同步到你的其他裝置。';render()}else{$('#authUser').style.display='flex';$('#userName').textContent=u.displayName||u.email||'Google 使用者';$('#photo').src=u.photoURL||'';$('#signIn').style.display='none';$('#redirect').style.display='none';startCloud(u)}});render();
</script></body></html>
